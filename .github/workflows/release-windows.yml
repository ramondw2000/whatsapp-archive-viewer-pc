name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the Windows build to (e.g. v0.1.0)'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        working-directory: project-code
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: project-code
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'WhatsApp Archive Viewer (PC) ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'Automated Windows + Linux build.'
          releaseDraft: true
          includeUpdaterJson: false
